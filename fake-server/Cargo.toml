[package]
name = "leanote-fakeserver"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
