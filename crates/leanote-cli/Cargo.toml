[package]
name = "leanote-cli"
version.workspace = true
edition.workspace = true

[[bin]]
# `Leanote` (GUI) and `leanote` (this bin) collide on case-insensitive
# filesystems (APFS/NTFS): cargo writes both to target/release and one
# clobbers the other. Distinct cargo names; installers present it as
# `leanote` on case-sensitive fs / bin\leanote.exe / leanote-cli in .app.
name = "leanote-cli"
path = "src/main.rs"

[dependencies]
leanote-core = { path = "../leanote-core" }
leanote-http = { path = "../leanote-http" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[dev-dependencies]
leanote-fakeserver = { path = "../../fake-server" }
rusqlite = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
