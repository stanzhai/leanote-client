[package]
name = "leanote-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Leanote"
path = "src/main.rs"

[dependencies]
leanote-core = { path = "../leanote-core" }
leanote-reader = { path = "../leanote-reader" }
gpui-base = { version = "0.7.3" }
leanote-fakeserver = { path = "../../fake-server" }
gpui-kit = { version = "0.7.3", features = [
  # Issue 21: kit's full language aggregate (34 grammars) instead of a
  # hand-picked subset.
  "tree-sitter-languages",
] }

anyhow = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
smol = "2"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
# Local PDF export: system fonts first (CJK via OS font dirs), embedded
# Libertinus/DejaVu as guaranteed fallback.
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
resvg = "0.46.0"
knit-md-docx = "0.1.0"
# History dialog: two-text unified patch for the kit Diff widget (same
# version the kit itself vendors — already in Cargo.lock).
similar = "2.7"


# Windows-only Win32 calls for the high-DPI viewport resync (main.rs
# win_dpi_resync): FindWindow/GetClientRect/SetWindowPos. Same crate the
# gpui Windows backend already links, so no new code in the tree.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
gpui-pre = { version = "=0.3.9", package = "gpui-pre", features = [
  "test-support",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

