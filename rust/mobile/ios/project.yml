name: Leanote
options:
  bundleIdPrefix: site.stanzhai.leanote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # 模拟器构建免签；真机/TestFlight 由 Xcode 自动签名（Team 253N8647LQ，
    # issue 09：需在 Xcode 登录开发者账号后首次真机构建时自动创建
    # Apple Development 证书与 profile）。
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    DEVELOPER_TEAM: 253N8647LQ

targets:
  Leanote:
    type: application
    platform: iOS
    sources:
      - path: App.swift
        type: file
        buildPhase: sources
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      # .xcassets 必须由 actool 编译（Assets.car + Info.plist 图标键）；
      # type: folder 会退化成原样拷贝，主屏图标不生效（issue 18）。
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.stanzhai.leanote.mobile
        PRODUCT_NAME: Leanote
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "Embedding.h"
        ENABLE_DEBUG_DYLIB: NO
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(LEANOTE_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework SystemConfiguration"
          - "-ObjC"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        "LEANOTE_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/debug/libleanote_mobile.a"
        "LEANOTE_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/debug/libleanote_mobile.a"
      configs:
        Release:
          "LEANOTE_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/release/libleanote_mobile.a"
          "LEANOTE_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libleanote_mobile.a"
    preBuildScripts:
      - name: "Build Rust Static Library"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Xcode GUI apps don't source shell profiles; rustup's cargo lives here.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          command -v cargo >/dev/null 2>&1 || {
            echo "error: cargo not found — install Rust via https://rustup.rs" >&2
            exit 1
          }
          cd "${PROJECT_DIR}/../.."

          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            RUST_TARGET="aarch64-apple-ios-sim"
            SDK="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
          else
            RUST_TARGET="aarch64-apple-ios"
            SDK="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          fi
          # xcode-select points at CommandLineTools (no iOS SDK) — drive the
          # toolchain explicitly until `sudo xcode-select -s /Applications/Xcode.app`.
          TC="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          export SDKROOT="$SDK"
          export CC_aarch64_apple_ios="$TC/clang"
          export CC_aarch64_apple_ios_sim="$TC/clang"
          export CXX_aarch64_apple_ios="$TC/clang++"
          export CXX_aarch64_apple_ios_sim="$TC/clang++"
          export AR_aarch64_apple_ios="$TC/ar"
          export AR_aarch64_apple_ios_sim="$TC/ar"
          export IPHONEOS_DEPLOYMENT_TARGET=13.0

          if [ "${CONFIGURATION}" = "Release" ]; then
            CARGO_FLAGS="--release"
          else
            CARGO_FLAGS=""
          fi
          echo "Building leanote-mobile for ${RUST_TARGET} (${CONFIGURATION})..."
          cargo build --lib -p leanote-mobile --target "${RUST_TARGET}" ${CARGO_FLAGS}
