			shellScript = "set -euo pipefail\n# Xcode GUI apps don't source shell profiles; rustup's cargo lives here.\nexport PATH=\"$HOME/.cargo/bin:/opt/homebrew/bin:$PATH\"\ncommand -v cargo >/dev/null 2>&1 || {\n  echo \"error: cargo not found — install Rust via https://rustup.rs\" >&2\n  exit 1\n}\ncd \"${PROJECT_DIR}/../..\"\n\nif [ \"${PLATFORM_NAME}\" = \"iphonesimulator\" ]; then\n  RUST_TARGET=\"aarch64-apple-ios-sim\"\n  SDK=\"/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk\"\nelse\n  RUST_TARGET=\"aarch64-apple-ios\"\n  SDK=\"/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk\"\nfi\n# xcode-select points at CommandLineTools (no iOS SDK) — drive the\n# toolchain explicitly until `sudo xcode-select -s /Applications/Xcode.app`.\nTC=\"/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin\"\nexport SDKROOT=\"$SDK\"\nexport CC_aarch64_apple_ios=\"$TC/clang\"\nexport CC_aarch64_apple_ios_sim=\"$TC/clang\"\nexport CXX_aarch64_apple_ios=\"$TC/clang++\"\nexport CXX_aarch64_apple_ios_sim=\"$TC/clang++\"\nexport AR_aarch64_apple_ios=\"$TC/ar\"\nexport AR_aarch64_apple_ios_sim=\"$TC/ar\"\nexport IPHONEOS_DEPLOYMENT_TARGET=13.0\n\nif [ \"${CONFIGURATION}\" = \"Release\" ]; then\n  CARGO_FLAGS=\"--release\"\nelse\n  CARGO_FLAGS=\"\"\nfi\necho \"Building leanote-mobile for ${RUST_TARGET} (${CONFIGURATION})...\"\ncargo build --lib -p leanote-mobile --target \"${RUST_TARGET}\" ${CARGO_FLAGS}\n";
