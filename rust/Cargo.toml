[workspace]
resolver = "2"
members = ["crates/leanote-core", "crates/leanote-cli", "crates/leanote-http", "crates/leanote-app", "crates/leanote-mobile", "fake-server"]
# leanote: path deps under the workspace dir auto-join the workspace; their
# examples (e.g. gpui-pre's pattern.rs needs the zed-internal gpui_platform
# crate) don't compile standalone. Keep them as deps only.
exclude = ["vendor/gpui-pre", "vendor/gpui-pre-mobile"]

[workspace.package]
edition = "2021"
version = "3.1.0"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[patch.crates-io]
# leanote: vendored with one change — ElementInputHandler::prefers_ime_for_printable_keys
# forced to false so a CJK IME cannot swallow printable keys before GPUI dispatch
# (breaks vim normal mode). Re-vendor on gpui-pre upgrade. See ADR-0005.
gpui-pre = { path = "vendor/gpui-pre" }
# leanote: vendored with additions — ① block caret painting for vim normal
# mode (set_block_cursor); ② image click hook: MarkdownPlugin::configure +
# TextView::image_context_menu so a component-layer TextView can attach an
# image click handler (right-click menu in previews) through .plugin().
# Re-vendor on gpui-base upgrade. See ADR-0005.
gpui-base = { path = "vendor/gpui-base" }
# leanote: vendored with one change — shader_barycentrics probe guarded with
# respondsToSelector (wgpu 30.0.1's fix backported). Xcode's Metal API
# validation wraps the device in CaptureMTLDevice, which doesn't declare the
# selector; objc2's generated send panics "method not found" and aborts at
# startup. Re-vendor on wgpu upgrade (29.0.4 → check upstream fixed). See
# .scratch/mobile/issues/12.
wgpu-hal = { path = "vendor/wgpu-hal" }
