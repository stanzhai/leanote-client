[package]
name = "leanote-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "Leanote"
path = "src/main.rs"

[dependencies]
leanote-core = { path = "../leanote-core" }
gpui-base = { version = "0.7.3" }
leanote-fakeserver = { path = "../../fake-server" }
gpui-kit = { version = "0.7.3", features = [
  # Issue 21: kit's full language aggregate (34 grammars) instead of a
  # hand-picked subset.
  "tree-sitter-languages",
] }

anyhow = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
smol = "2"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
# Local PDF export: system fonts first (CJK via OS font dirs), embedded
# Libertinus/DejaVu as guaranteed fallback.
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }

[dev-dependencies]
gpui-pre = { version = "=0.3.9", package = "gpui-pre", features = [
  "test-support",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
# Paths relative to the crate dir; winresource resolves icon from metadata
# and the manifest is passed explicitly in build.rs.
icon = "packaging/icon.ico"

# build.rs compiles packaging/leanote.exe.manifest into the exe on Windows;
# paths there are resolved from CARGO_MANIFEST_DIR (repo-root-relative via
# ../../packaging) because build scripts run with the workspace root as cwd.
