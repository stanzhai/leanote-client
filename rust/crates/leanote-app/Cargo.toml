[package]
name = "leanote-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "leanote-app"
path = "src/main.rs"

[dependencies]
leanote-core = { path = "../leanote-core" }
leanote-fakeserver = { path = "../../fake-server" }
gpui-kit = { version = "0.7.3", features = [
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-rust",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-tsx",
  "tree-sitter-html",
  "tree-sitter-css",
  "tree-sitter-bash",
  "tree-sitter-python",
  "tree-sitter-go",
  "tree-sitter-yaml",
  "tree-sitter-toml",
] }

anyhow = "1"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
smol = "2"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
gpui-pre = { version = "=0.3.9", package = "gpui-pre", features = [
  "test-support",
] }
