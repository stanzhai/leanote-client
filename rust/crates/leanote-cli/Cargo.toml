[package]
name = "leanote-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "leanote"
path = "src/main.rs"

[dependencies]
leanote-core = { path = "../leanote-core" }
leanote-http = { path = "../leanote-http" }

[dev-dependencies]
leanote-fakeserver = { path = "../../fake-server" }
rusqlite = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
